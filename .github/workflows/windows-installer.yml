name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        # better-sqlite3 и node-pty поставляются с готовыми N-API-бинарниками, а сборка идёт
        # с npmRebuild:false. Пересборка в postinstall (electron-builder install-app-deps)
        # на раннере падала: node-gyp не находил Visual Studio.
        run: npm ci --ignore-scripts

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LiteSSH-Windows-installer
          path: release/*-setup.exe
          if-no-files-found: error
          retention-days: 14
