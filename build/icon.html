<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        width: 512px;
        height: 512px;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#161b22" />
          <stop offset="1" stop-color="#0d1117" />
        </linearGradient>
        <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#58a6ff" />
          <stop offset="1" stop-color="#39c5cf" />
        </linearGradient>
        <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#a5d6ff" />
          <stop offset="0.5" stop-color="#3B82F6" />
          <stop offset="1" stop-color="#2563EB" />
        </radialGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="b" />
          <feMerge>
            <feMergeNode in="b" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <rect x="26" y="26" width="460" height="460" rx="104" fill="url(#bg)" />
      <rect
        x="26.5"
        y="26.5"
        width="459"
        height="459"
        rx="104"
        fill="none"
        stroke="#30363d"
        stroke-width="3"
      />

      <g transform="translate(256 256)" fill="none" stroke="url(#orbit)" stroke-width="11">
        <ellipse rx="168" ry="66" transform="rotate(0)" opacity="0.95" />
        <ellipse rx="168" ry="66" transform="rotate(60)" opacity="0.95" />
        <ellipse rx="168" ry="66" transform="rotate(120)" opacity="0.95" />
      </g>

      <g transform="translate(256 256)" fill="#79c0ff" filter="url(#glow)">
        <circle cx="168" cy="0" r="15" />
        <circle cx="-84" cy="145.5" r="15" transform="rotate(60)" />
        <circle cx="-84" cy="145.5" r="15" transform="rotate(120)" />
      </g>

      <circle cx="256" cy="256" r="46" fill="url(#core)" filter="url(#glow)" />
    </svg>
  </body>
</html>
